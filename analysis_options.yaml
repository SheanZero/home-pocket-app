include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
  errors:
    invalid_annotation_target: ignore

plugins:
  riverpod_lint: 3.1.4
  import_lint: 2.0.0

import_lint:
  severity: error
  rules:
    plaintext_sqlite_forbidden:
      target: "package:home_pocket/**"
      from: "package:sqlite3_flutter_libs/**"
      except: []
    infrastructure_to_application:
      target: "package:home_pocket/infrastructure/**"
      from: "package:home_pocket/application/**"
      except: []
    infrastructure_to_presentation:
      target: "package:home_pocket/infrastructure/**"
      from: "package:home_pocket/features/*/presentation/**"
      except: []
    application_to_presentation:
      target: "package:home_pocket/application/**"
      from: "package:home_pocket/features/*/presentation/**"
      except: []
    domain_to_data:
      target: "package:home_pocket/features/*/domain/**"
      from: "package:home_pocket/data/**"
      except: []
    domain_to_infrastructure:
      target: "package:home_pocket/features/*/domain/**"
      from: "package:home_pocket/infrastructure/**"
      except: []
    domain_to_application:
      target: "package:home_pocket/features/*/domain/**"
      from: "package:home_pocket/application/**"
      except: []
    domain_to_presentation:
      target: "package:home_pocket/features/*/domain/**"
      from: "package:home_pocket/features/*/presentation/**"
      except: []
    domain_to_flutter:
      target: "package:home_pocket/features/*/domain/**"
      from: "package:flutter/**"
      except: []
    presentation_ui_to_data_daos:
      target: "package:home_pocket/features/*/presentation/{navigation,screens,theme,utils,widgets}/**"
      from: "package:home_pocket/data/daos/**"
      except: []
    presentation_ui_to_data_tables:
      target: "package:home_pocket/features/*/presentation/{navigation,screens,theme,utils,widgets}/**"
      from: "package:home_pocket/data/tables/**"
      except: []

linter:
  rules:
    prefer_single_quotes: true
    prefer_relative_imports: true
    avoid_print: true
