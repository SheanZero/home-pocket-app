# Phase 62 makes release_gate.dart the only pass/fail authority for PRs.
# Secondary audit scanners remain artifact producers; their outcomes never define
# the candidate verdict.
name: audit

on:
  pull_request:
    branches: [main]

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate-host:
    name: Release gate host scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
      - name: Run the repository-owned PR authority
        run: dart run scripts/release_gate.dart --scope=host

  audit-scanners:
    name: Supplemental audit artifacts
    needs: release-gate-host
    if: ${{ always() }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
      - run: flutter pub get --enforce-lockfile
      - name: Audit scanners
        run: |
          bash scripts/audit_layer.sh
          bash scripts/audit_dead_code.sh
          bash scripts/audit_providers.sh
          bash scripts/audit_duplication.sh
      - name: Merge findings
        run: dart run scripts/merge_findings.dart
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: audit-issues
          path: |
            tool/audit/issues.json
            tool/audit/ISSUES.md
            tool/audit/shards/*.json
            tool/audit/agent-shards/*.json
