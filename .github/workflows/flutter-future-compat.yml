# P2-04 early-warning lane. Stable CI remains pinned in audit.yml; this weekly
# probe intentionally follows Flutter beta so upcoming SwiftPM/Kotlin removals
# fail here before the stable SDK reaches the project.
name: flutter-future-compat

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

concurrency:
  group: flutter-future-compat
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-beta:
    name: Flutter beta Android build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart run scripts/dependency_compatibility.dart --mode=future-probe --verify-running-flutter-sdk
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --debug

  ios-beta:
    name: Flutter beta iOS simulator build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart run scripts/dependency_compatibility.dart --mode=future-probe --verify-running-flutter-sdk
      - run: flutter analyze --no-fatal-infos
      - run: flutter build ios --simulator --debug
