# Device-level release gate. Host `flutter test` and workflow declaration are
# not runtime substitutes: these jobs boot Android/iOS and exercise the full
# integration_test directory against the native SQLCipher library.
name: device-e2e

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "integration_test/**"
      - "android/**"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/device-e2e.yml"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "integration_test/**"
      - "android/**"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/device-e2e.yml"

concurrency:
  group: device-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-device-e2e:
    name: Android Emulator full suite (API 36 x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run device integration suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: flutter test integration_test/ -d emulator-5554 -r expanded
      - name: Regenerate clean Android release metadata after integration tests
        # This proves an integration-test registrant cannot contaminate the
        # next release candidate. It only generates Android release metadata,
        # so it does not consume production signing credentials.
        run: bash scripts/release_preflight.sh --platform android

  ios-device-e2e:
    name: iOS device smoke (simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Boot an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available \
            | awk -F '[()]' '/iPhone/ && /(Shutdown|Booted)/ {print $2; exit}')"
          if [[ -z "$device_id" ]]; then
            echo "::error::No available iPhone simulator runtime"
            exit 1
          fi
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          echo "IOS_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
      - name: Run device integration suite
        run: flutter test integration_test/ -d "$IOS_DEVICE_ID" -r expanded
      - name: Rebuild a clean unsigned iOS release candidate after integration tests
        # The script builds an unsigned iOS release artifact, then scans its
        # binary after excluding the dev-only integration_test dependency.
        # Signed IPA creation remains a separately credentialed release action.
        run: bash scripts/release_preflight.sh --platform ios
