# Phase 62 main-merge release gate. The Apple-Silicon job below is the sole
# mandatory platform verdict; GitHub/Intel x86 evidence remains supplemental.
name: device-e2e

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: device-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate-full:
    name: Apple-Silicon full release gate
    # CI-A: owner-operated runner authorization. A missing/offline runner stays
    # queued or fails; it is never replaced by GitHub-hosted x86 evidence.
    runs-on: [self-hosted, macOS, ARM64, happy-pocket-release]
    timeout-minutes: 120
    env:
      PHASE62_CI_TOPOLOGY: CI-A
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Run the repository-owned main authority
        run: dart run scripts/release_gate.dart --scope=full
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: release-gate-full-evidence
          path: build/release_gate/
          if-no-files-found: warn

  android-device-e2e:
    # Supplemental x86_64 runtime lane for GitHub/Intel hosts. Its outcome is
    # a named limitation and cannot block or satisfy the CI-A aggregate verdict.
    name: Android Emulator supplemental suite (API 36 x86_64 GitHub/Intel)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PHASE62_X86_CLASSIFICATION: supplemental
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - id: integration
        name: Run device integration suite
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: flutter test integration_test/ -d emulator-5554 -r expanded
      - id: preflight
        name: Regenerate clean Android release metadata after integration tests
        if: ${{ always() }}
        continue-on-error: true
        run: bash scripts/release_preflight.sh --platform android
      - name: Record supplemental x86 outcome
        if: ${{ always() }}
        run: |
          mkdir -p build/release_gate
          printf '{"classification":"supplemental","integration":"%s","preflight":"%s"}\n' \
            "${{ steps.integration.outcome }}" "${{ steps.preflight.outcome }}" \
            > build/release_gate/supplemental-x86.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: release-gate-supplemental-x86
          path: build/release_gate/supplemental-x86.json
          if-no-files-found: error
      - name: Surface supplemental limitation
        if: ${{ steps.integration.outcome == 'failure' || steps.preflight.outcome == 'failure' }}
        run: exit 1
