baseURL = "https://happypocket.app/"
title = "Happy Pocket: Family Budget"
defaultContentLanguage = "ja"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  githubURL = "https://github.com/SheanZero/home-pocket-app"
  iosURL = "https://apps.apple.com/jp/app/happy-pocket/id6800526303"
  androidURL = "https://play.google.com/store/apps/details?id=com.sheanzero.happypocket.app"
  storeListingsReady = false
  productVersion = "1.0.0"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[minify]
  minifyOutput = true

[languages]
  [languages.ja]
    languageCode = "ja-JP"
    languageName = "日本語"
    title = "ハピポケ家族家計簿"
    weight = 1
    contentDir = "content/ja"
    screenshotLanguage = "ja"
  [languages.zh]
    languageCode = "zh-CN"
    languageName = "简体中文"
    title = "Happy Pocket 家庭账本"
    weight = 2
    contentDir = "content/zh"
    screenshotLanguage = "en"
  [languages.en]
    languageCode = "en"
    languageName = "English"
    title = "Happy Pocket: Family Budget"
    weight = 3
    contentDir = "content/en"
    screenshotLanguage = "en"
