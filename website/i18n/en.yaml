faq_eyebrow:
  other: "Questions, answered"
faq_title:
  other: "What you should know before you begin."
faq_body:
  other: "A clear view of release status, sharing boundaries, and how your data is handled."
faq_1_question:
  other: "When can I download it?"
faq_1_answer:
  other: "The iPhone app is available on the App Store. The Android release is still in preparation."
faq_2_question:
  other: "Does my financial data go to the cloud?"
faq_2_answer:
  other: "Plaintext financial data is stored on-device. Connections occur for exchange rates, optional notifications, and family sync; shared records are encrypted on your device before they are sent."
faq_3_question:
  other: "Can my family see every expense?"
faq_3_answer:
  other: "No. Household and personal ledgers are separate. You choose which records belong in the shared household view, while private records stay on your device."
faq_4_question:
  other: "Which languages and devices are supported?"
faq_4_answer:
  other: "The app targets Japanese, English, and Chinese on iOS 15+ and Android 7+. This website is available in all three languages."
faq_5_question:
  other: "Are there ads or usage analytics?"
faq_5_answer:
  other: "There are no ads and no third-party advertising or behavioral analytics SDK. The privacy page explains each limited external connection separately."

