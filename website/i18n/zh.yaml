faq_eyebrow:
  other: "常见问题"
faq_title:
  other: "开始之前，你应该清楚了解这些。"
faq_body:
  other: "如实说明发布状态、家庭共享边界和数据处理方式。"
faq_1_question:
  other: "什么时候可以下载？"
faq_1_answer:
  other: "Happy Pocket 正在准备 App Store 和 Google Play 发布。商店审核完成后，本站按钮会更新为正式产品页面。"
faq_2_question:
  other: "我的财务数据会进入云端吗？"
faq_2_answer:
  other: "明文财务数据保存在设备上。汇率获取、可选通知和家庭同步会产生网络连接；共享记录会在发送前于设备上加密。"
faq_3_question:
  other: "家人能看到我的每一笔消费吗？"
faq_3_answer:
  other: "不能。家庭账本和个人账本相互分开。由你选择哪些记录进入家庭视图，私人记录仍保存在自己的设备上。"
faq_4_question:
  other: "支持哪些语言和设备？"
faq_4_answer:
  other: "应用支持日语、英语和简体中文，目标平台为 iOS 15 及以上和 Android 7 及以上；网站也提供这三种语言。"
faq_5_question:
  other: "是否有广告或使用情况分析？"
faq_5_answer:
  other: "没有广告，也没有第三方广告或行为分析 SDK。隐私设计页面会分别解释必要且有限的外部连接。"

