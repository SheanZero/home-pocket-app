faq_eyebrow:
  other: "よくある質問"
faq_title:
  other: "始める前に、きちんと知ってほしいこと。"
faq_body:
  other: "公開状況やデータの扱いを、できるだけ率直にまとめました。"
faq_1_question:
  other: "いつダウンロードできますか？"
faq_1_answer:
  other: "現在は App Store と Google Play での公開準備中です。審査が完了したら、このサイトのボタンを正式な商品ページへ更新します。"
faq_2_question:
  other: "家計データはクラウドに送られますか？"
faq_2_answer:
  other: "平文の家計データは端末内に保存されます。為替レート取得、任意の通知、家族同期では通信が発生しますが、家族記録は送信前に端末で暗号化されます。"
faq_3_question:
  other: "家族にはすべての支出が見えますか？"
faq_3_answer:
  other: "いいえ。家族で共有する帳簿と個人の帳簿を分けられます。共有する記録は自分で選び、個人の記録は端末だけに残せます。"
faq_4_question:
  other: "どの言語と端末に対応しますか？"
faq_4_answer:
  other: "アプリは日本語・英語・中国語、iOS 15 以降と Android 7 以降を対象にしています。このサイトも三言語で提供します。"
faq_5_question:
  other: "広告や利用状況の解析はありますか？"
faq_5_answer:
  other: "広告は表示せず、第三者の広告・行動解析SDKも組み込みません。必要な外部通信はプライバシー設計ページで個別に説明します。"

