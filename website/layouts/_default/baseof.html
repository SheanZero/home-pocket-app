<!doctype html>
<html lang="{{ .Site.Language.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0e7">
  <meta name="color-scheme" content="light">
  <title>{{ if .IsHome }}{{ .Title }} — {{ i18n "meta_tagline" }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Params.description | default (i18n "meta_description") }}">
  <link rel="canonical" href="{{ .Permalink }}">
  {{ range .AllTranslations }}<link rel="alternate" hreflang="{{ .Language.LanguageCode }}" href="{{ .Permalink }}">{{ end }}
  <link rel="icon" type="image/png" href="{{ "images/app-icon.png" | relURL }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Title }} — {{ i18n "meta_tagline" }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}">
  <meta property="og:description" content="{{ .Params.description | default (i18n "meta_description") }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:locale" content="{{ .Site.Language.LanguageCode | replaceRE "-" "_" }}">
  <meta property="og:image" content="{{ "images/hero-family.jpg" | absURL }}">
  <meta name="twitter:card" content="summary_large_image">
  {{ $style := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">
  {{ $script := resources.Get "js/main.js" | minify | fingerprint }}
  <script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>
</head>
<body class="{{ if .IsHome }}home-page{{ else }}inner-page page-{{ .Params.translationKey }}{{ end }}" data-lang="{{ .Lang }}">
  <a class="skip-link" href="#main">{{ i18n "skip_to_content" }}</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
