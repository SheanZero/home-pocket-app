name: home_pocket
description: "Local-first, privacy-focused family accounting app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Internationalization
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  # State Management
  flutter_riverpod: 3.3.2
  riverpod_annotation: 4.0.3

  # Immutable Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0

  # Cryptography
  cryptography: ^2.7.0
  crypto: ^3.0.6

  # Secure Storage
  flutter_secure_storage: ^10.3.1

  # Biometric Authentication
  local_auth: ^3.0.2

  # Unique ID Generation
  table_calendar: ^3.2.0
  ulid: ^2.0.0

  # Voice Input
  # 7.4.0 was published from a beta line and breaks the current adapter API
  # (deprecated listen arguments plus bool/int mock incompatibilities).
  speech_to_text: 7.3.0

  # Charts
  fl_chart: ^1.2.0

  # Settings & Preferences
  shared_preferences: ^2.3.4

  # File Operations
  file_picker: ^11.0.3
  image_picker: ^1.2.3
  # Keep this stable trio aligned. package_info_plus 10 / share_plus 13 need
  # win32 6, while the latest stable file_picker 11 still requires win32 5.
  # See docs/testing/DEPENDENCY_COMPATIBILITY.md before changing any of them.
  share_plus: ^12.0.2
  package_info_plus: ^9.0.1

  # External URL launching (privacy/terms hosted URLs + sponsor link).
  # url_launcher_windows has no win32 dep → safe with the pinned win32 trio above.
  url_launcher: ^6.3.2

  # Database
  drift: 2.34.0
  # sqlite3 3.x distributes SQLCipher through Dart Native Assets. Keep this
  # direct dependency aligned with drift/drift_dev and the hook selection below.
  sqlite3: ^3.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  pinenacl: ^0.6.0
  http: ^1.6.0
  uuid: ^4.6.0
  qr_flutter: ^4.1.0
  # The upstream package declares six unused variable-weight fonts in addition
  # to the static Lucide font. Keep the compatible package API, but resolve it
  # to the reviewed static-only subset in third_party/ (see its README).
  lucide_icons_flutter:
    path: third_party/lucide_icons_flutter
  web_socket_channel: ^3.0.0
  connectivity_plus: ^7.3.1
  collection: ^1.19.1
  flutter_svg: ^2.3.0
  # Parses the trusted, bundled legal HTML rendered by LegalHtmlView.
  html: 0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Flutter SDK package (no pub.dev fetch) — drives the on-device/simulator
  # encrypted-executor migration ladder (integration_test/). The SQLCipher
  # Native Asset is selected by the sqlite3 build hook below.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  # The stable 3.2.3 release caps analyzer below 9; this reviewed dev build is
  # required by the analyzer 12 Riverpod/Drift code-generation cohort.
  freezed: 3.2.6-dev.1
  json_serializable: ^6.9.4
  riverpod_generator: 4.0.4
  # Both lints use Dart's analysis_server_plugin protocol and share the
  # analyzer 12 graph selected by this Drift/Riverpod cohort.
  riverpod_lint: 3.1.4
  import_lint: ^2.0.0
  drift_dev: 2.34.0

  # Testing
  fake_async: ^1.3.3
  mocktail: ^1.0.4
  # Transitive via url_launcher (56-01); referenced directly to mock
  # UrlLauncherPlatform.instance in the sponsor-launch widget test (56-05).
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2

  # Audit Tooling
  dart_code_linter: ^4.1.9

  # Architecture Tests
  yaml: ^3.1.0

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/RobotoMono-OFL.txt
    - assets/licenses/native/
    - assets/satisfaction/
    - assets/legal/
    - docs/mockup/v16/assets/onboarding-privacy-warm-v1.png
    - docs/mockup/v16/assets/onboarding-privacy-warm-v1-dark.png
    - docs/mockup/v16/assets/family-entry-create-warm-v1.png
    - docs/mockup/v16/assets/family-entry-create-warm-v1-dark.png
    - docs/mockup/v16/assets/family-entry-join-warm-v1.png
    - docs/mockup/v16/assets/family-entry-join-warm-v1-dark.png

  fonts:
    - family: RobotoMonoNumerals
      fonts:
        - asset: assets/fonts/RobotoMonoNumerals-Variable.ttf
