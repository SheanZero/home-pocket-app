        &lt;div class=&quot;section-head&quot;&gt;&lt;h2&gt;发布前仍需的人机 / 环境验证&lt;/h2&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;不属于已确认代码缺口&lt;/span&gt;&lt;/div&gt;
        &lt;ul class=&quot;limitation-list&quot;&gt;
          &lt;li&gt;在真实 PostgreSQL 上执行 000016 &lt;code&gt;up → insert member_rotation_key → down&lt;/code&gt;，并做多连接事务交错。&lt;/li&gt;
          &lt;li&gt;iOS / Android 多真机验证邀请、审批、离线、杀进程、移除、Owner transfer、epoch recovery 与 Push initial/opened。&lt;/li&gt;
          &lt;li&gt;真实 APNs / FCM 后台限制、文件保护与网络切换 UAT；当前已由确定性重建与竞态测试覆盖代码边界。&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;audit-panel&quot; data-audit-panel=&quot;states&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;section-block&quot;&gt;
        &lt;div class=&quot;section-head&quot;&gt;&lt;h2&gt;家庭全流程&lt;/h2&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;控制面先于数据面&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;flow-stack&quot;&gt;
          &lt;div class=&quot;flow-lane&quot;&gt;
            &lt;div class=&quot;flow-label&quot;&gt;创建家庭&lt;/div&gt;
            &lt;div class=&quot;flow-steps&quot;&gt;
              &lt;div class=&quot;flow-step control&quot;&gt;&lt;strong&gt;显式确认创建&lt;/strong&gt;Server 单 live-group gate；App 生成 group key。&lt;/div&gt;
              &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;Owner active&lt;/strong&gt;保存权威 group/member、key epoch 与控制 revision。&lt;/div&gt;
              &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;生成邀请&lt;/strong&gt;Owner 创建/刷新/revoke，code 与 expiry 可分享。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;flow-lane&quot;&gt;
            &lt;div class=&quot;flow-label&quot;&gt;加入与审批&lt;/div&gt;
            &lt;div class=&quot;flow-steps&quot;&gt;
              &lt;div class=&quot;flow-step control&quot;&gt;&lt;strong&gt;Join request&lt;/strong&gt;pending；支持 cancel / reject / expire / reapply。&lt;/div&gt;
              &lt;div class=&quot;flow-step control&quot;&gt;&lt;strong&gt;Owner approve&lt;/strong&gt;Server active gate；定向密钥信封。&lt;/div&gt;
              &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;Confirming&lt;/strong&gt;snapshot → targeted key pull → membership revalidate。&lt;/div&gt;
              &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;Active&lt;/strong&gt;初始 FullSync + Pull；等待态不会提前进入家庭管理。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;flow-lane&quot;&gt;
            &lt;div class=&quot;flow-label&quot;&gt;移除成员&lt;/div&gt;
            &lt;div class=&quot;flow-steps&quot;&gt;
              &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;准备 rotation intent&lt;/strong&gt;首个网络边界前持久化 next key、稳定 requestId、精确 envelopes。&lt;/div&gt;
              &lt;div class=&quot;flow-step control&quot;&gt;&lt;strong&gt;Server 单事务&lt;/strong&gt;锁 group/member；校验收件集；移除成员、推进 epoch、写信封和 event。&lt;/div&gt;
              &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;App 提交新 epoch&lt;/strong&gt;清退休密文 → 重放 semantic outbox → Full reconcile。&lt;/div&gt;
              &lt;div class=&quot;flow-step failure&quot;&gt;&lt;strong&gt;掉线 / 响应丢失&lt;/strong&gt;intent 与 operationId 保持稳定；冷启重放，不误删 outbox。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;flow-lane&quot;&gt;
            &lt;div class=&quot;flow-label&quot;&gt;Owner transfer / 离场&lt;/div&gt;
            &lt;div class=&quot;flow-steps&quot;&gt;
              &lt;div class=&quot;flow-step control&quot;&gt;&lt;strong&gt;Owner transfer&lt;/strong&gt;精确 active recipient set、角色互换、epoch + control event 同事务。&lt;/div&gt;
              &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;本地恢复&lt;/strong&gt;新 key/snapshot 提交后执行 epoch recovery。&lt;/div&gt;
              &lt;div class=&quot;flow-step control&quot;&gt;&lt;strong&gt;Member self-leave&lt;/strong&gt;进入 rotation_pending；仅 active Owner 可完成轮换。&lt;/div&gt;
              &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;终态&lt;/strong&gt;removed / left / inactive 设备清本地 family、key、queue 与导航态。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;state-grid&quot;&gt;
        &lt;div class=&quot;section-block&quot;&gt;
          &lt;div class=&quot;section-head&quot;&gt;&lt;h3&gt;App 成员 / 家庭状态&lt;/h3&gt;&lt;/div&gt;
          &lt;div class=&quot;state-map&quot;&gt;
            &lt;div class=&quot;state-row&quot;&gt;&lt;div class=&quot;state-node&quot;&gt;none&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div&gt;create 或 join&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;state-row&quot;&gt;&lt;div class=&quot;state-node control&quot;&gt;pending&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div&gt;reject / cancel / expire / owner approve&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;state-row&quot;&gt;&lt;div class=&quot;state-node control&quot;&gt;confirming&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div&gt;awaiting key / targeted pull&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;state-row&quot;&gt;&lt;div class=&quot;state-node&quot;&gt;active&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div&gt;rename / sync / transfer / remove / leave&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;state-row&quot;&gt;&lt;div class=&quot;state-node control&quot;&gt;rotation pending&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div&gt;Owner completes → active/new epoch&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;state-row&quot;&gt;&lt;div class=&quot;state-node&quot;&gt;inactive&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div&gt;本地权威清理完成&lt;/div&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;section-block&quot;&gt;
          &lt;div class=&quot;section-head&quot;&gt;&lt;h3&gt;Server 权威状态&lt;/h3&gt;&lt;/div&gt;
          &lt;div class=&quot;state-map&quot;&gt;
            &lt;div class=&quot;state-row&quot;&gt;&lt;div class=&quot;state-node control&quot;&gt;Group active&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div&gt;revision/event 每次 mutation 单调推进&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;state-row&quot;&gt;&lt;div class=&quot;state-node control&quot;&gt;Member pending&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div&gt;active / rejected / cancelled / expired&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;state-row&quot;&gt;&lt;div class=&quot;state-node control&quot;&gt;Member active&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div&gt;removed / left / owner transferred&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;state-row&quot;&gt;&lt;div class=&quot;state-node control&quot;&gt;rotation_pending&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div&gt;Owner-only metadata 与 completion&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;state-row&quot;&gt;&lt;div class=&quot;state-node control&quot;&gt;Group inactive&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div&gt;所有成员与传输授权终止&lt;/div&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;section-block&quot;&gt;
        &lt;div class=&quot;section-head&quot;&gt;&lt;h2&gt;冷启动 / Resume 顺序&lt;/h2&gt;&lt;/div&gt;
        &lt;div class=&quot;flow-steps&quot;&gt;
          &lt;div class=&quot;flow-step failure&quot;&gt;&lt;strong&gt;0 · pending wipe&lt;/strong&gt;开 SQLCipher 后先恢复 journal；失败不生成身份、不 seed、不进路由。&lt;/div&gt;
          &lt;div class=&quot;flow-step control&quot;&gt;&lt;strong&gt;1 · control events&lt;/strong&gt;分页拉事件，revision 排序与去重。&lt;/div&gt;
          &lt;div class=&quot;flow-step control&quot;&gt;&lt;strong&gt;2 · snapshot&lt;/strong&gt;权威 member/role/epoch/name + event ledger 原子应用。&lt;/div&gt;
          &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;3 · recovery&lt;/strong&gt;rotation intent、Avatar GC、semantic outbox。&lt;/div&gt;
          &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;4 · pull&lt;/strong&gt;分页、current epoch、入站 ledger/quarantine。&lt;/div&gt;
          &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;5 · WebSocket / Push&lt;/strong&gt;最后连接；身份世代与 membership gate。&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;audit-panel&quot; data-audit-panel=&quot;sync&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;section-block&quot;&gt;
        &lt;div class=&quot;section-head&quot;&gt;&lt;h2&gt;出站可靠状态机&lt;/h2&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;旧 epoch 密文不再是唯一副本&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;flow-steps&quot;&gt;
          &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;业务写&lt;/strong&gt;Transaction / Shopping / Profile / Avatar 与 semantic outbox 同一 SQLCipher transaction。&lt;/div&gt;
          &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;Pending&lt;/strong&gt;稳定 operationId、revision、origin；Avatar 仅安全 blob key/hash。&lt;/div&gt;
          &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;Materialize&lt;/strong&gt;逐 entry 隔离；Avatar missing/corrupt 自动 CAS 更高 revision removal。&lt;/div&gt;
          &lt;div class=&quot;flow-step control&quot;&gt;&lt;strong&gt;Encrypt / Push&lt;/strong&gt;使用 current key epoch；Server 同事务鉴权、幂等 claim、fan-out。&lt;/div&gt;
          &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;Relay ACK&lt;/strong&gt;仅明确 success 精确 settle；Queued/Error 保留 semantic outbox。&lt;/div&gt;
          &lt;div class=&quot;flow-step failure&quot;&gt;&lt;strong&gt;Epoch change&lt;/strong&gt;删除退休密文缓存，按新 key 重发 outbox，再 Full reconcile。&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;section-block&quot;&gt;
        &lt;div class=&quot;section-head&quot;&gt;&lt;h2&gt;入站 ACK / 隔离状态机&lt;/h2&gt;&lt;/div&gt;
        &lt;div class=&quot;flow-steps&quot;&gt;
          &lt;div class=&quot;flow-step control&quot;&gt;&lt;strong&gt;Pull pages&lt;/strong&gt;current epoch + active membership；hasMore 到尽，no-progress 防护。&lt;/div&gt;
          &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;解密后限额&lt;/strong&gt;每消息 ≤500 ops；每 op ≤64 KiB；外层标识有长度上限。&lt;/div&gt;
          &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;Apply&lt;/strong&gt;(groupId, operationId) 幂等；revision/origin 合并。&lt;/div&gt;
          &lt;div class=&quot;flow-step failure&quot;&gt;&lt;strong&gt;Transient failure&lt;/strong&gt;不 ACK，保留 Relay 消息等待重投。&lt;/div&gt;
          &lt;div class=&quot;flow-step failure&quot;&gt;&lt;strong&gt;Deterministic bad op&lt;/strong&gt;安全摘要/完整小载荷进入 quarantine；持久化成功才 ACK。&lt;/div&gt;
          &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;Maintenance&lt;/strong&gt;每群 200 条、1 MiB、30 天 TTL、SQL summary、UI 50 条分页。&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;section-block&quot;&gt;
        &lt;div class=&quot;section-head&quot;&gt;&lt;h2&gt;同步信息矩阵&lt;/h2&gt;&lt;/div&gt;
        &lt;div class=&quot;legend-row text-small&quot;&gt;
          &lt;span class=&quot;matrix-status&quot;&gt;&lt;span class=&quot;legend-dot control&quot;&gt;&lt;/span&gt;Server 权威控制面&lt;/span&gt;
          &lt;span class=&quot;matrix-status&quot;&gt;&lt;span class=&quot;legend-dot&quot;&gt;&lt;/span&gt;E2EE semantic sync&lt;/span&gt;
          &lt;span class=&quot;matrix-status&quot;&gt;&lt;span class=&quot;legend-dot local&quot;&gt;&lt;/span&gt;明确本地边界&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;table-responsive&quot;&gt;
          &lt;table class=&quot;table table-sm&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;信息&lt;/th&gt;&lt;th&gt;权威源&lt;/th&gt;&lt;th&gt;同步 / 收敛语义&lt;/th&gt;&lt;th&gt;隐私与失败边界&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;家庭、成员、角色、申请、邀请&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;matrix-status&quot;&gt;&lt;span class=&quot;legend-dot control&quot;&gt;&lt;/span&gt;Server&lt;/span&gt;&lt;/td&gt;&lt;td&gt;revision + eventId + snapshot；App control cursor 持久化。&lt;/td&gt;&lt;td&gt;所有 mutate/read 都验证 active membership 与 owner 权限。&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Key epoch / group key&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;matrix-status&quot;&gt;&lt;span class=&quot;legend-dot control&quot;&gt;&lt;/span&gt;Server epoch&lt;/span&gt; + App key&lt;/td&gt;&lt;td&gt;Server 只保存目标密钥信封；App 安装 key 后重放 outbox。&lt;/td&gt;&lt;td&gt;旧 epoch pull/push 拒绝；被移除成员无新 key。&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;账单&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;matrix-status&quot;&gt;&lt;span class=&quot;legend-dot&quot;&gt;&lt;/span&gt;App semantic state&lt;/span&gt;&lt;/td&gt;&lt;td&gt;revision/origin/tombstone；archived public 与 withdrawal 进入 FullSync。&lt;/td&gt;&lt;td&gt;private producer/full/receiver 三层 fail closed。&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;自定义分类&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;matrix-status&quot;&gt;&lt;span class=&quot;legend-dot&quot;&gt;&lt;/span&gt;App shared snapshot&lt;/span&gt;&lt;/td&gt;&lt;td&gt;被引用分类的 versioned snapshot/tombstone。&lt;/td&gt;&lt;td&gt;个人排序、归档与设备配置保持本地。&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Shopping&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;matrix-status&quot;&gt;&lt;span class=&quot;legend-dot&quot;&gt;&lt;/span&gt;App semantic outbox&lt;/span&gt;&lt;/td&gt;&lt;td&gt;create/update/toggle/delete/clear 均持久 revision；FullSync 包含 live+tombstone。&lt;/td&gt;&lt;td&gt;private/local-only 不写共享 outbox。&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Profile / Avatar&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;matrix-status&quot;&gt;&lt;span class=&quot;legend-dot&quot;&gt;&lt;/span&gt;App semantic outbox&lt;/span&gt;&lt;/td&gt;&lt;td&gt;revision/origin/digest；immutable content-addressed staging；poison 单行隔离。&lt;/td&gt;&lt;td&gt;outbox 不存绝对路径/图片 bytes；坏 blob 自动发 removal。&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;交易照片&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;matrix-status&quot;&gt;&lt;span class=&quot;legend-dot local&quot;&gt;&lt;/span&gt;设备本地&lt;/span&gt;&lt;/td&gt;&lt;td&gt;只同步 unavailable/local-only availability，不承诺内容恢复。&lt;/td&gt;&lt;td&gt;不把本地 path 或伪 photoHash 当远端引用。&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;PIN、偏好、过滤器、排序&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;matrix-status&quot;&gt;&lt;span class=&quot;legend-dot local&quot;&gt;&lt;/span&gt;设备本地&lt;/span&gt;&lt;/td&gt;&lt;td&gt;不进入家庭数据流；ClearAllData 本机擦除。&lt;/td&gt;&lt;td&gt;本机删除不发送 Server 删除，也不删除其他设备数据。&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;section-block&quot;&gt;
        &lt;div class=&quot;section-head&quot;&gt;&lt;h2&gt;本地隐私擦除状态机&lt;/h2&gt;&lt;/div&gt;
        &lt;div class=&quot;flow-steps&quot;&gt;
          &lt;div class=&quot;flow-step failure&quot;&gt;&lt;strong&gt;Journal&lt;/strong&gt;&lt;code&gt;databasePending&lt;/code&gt; 在首个 destructive step 前持久化。&lt;/div&gt;
          &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;Database&lt;/strong&gt;停写/断 WS；全表分类 fail-closed；事务清用户域；secure_delete + WAL truncate。&lt;/div&gt;
          &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;Files&lt;/strong&gt;只删 app-owned Avatar / staging / backup；拒绝相对路径与 symlink。&lt;/div&gt;
          &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;Secure&lt;/strong&gt;删 device identity、PIN、recovery；暂保 SQLCipher master key供重启恢复。&lt;/div&gt;
          &lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;Settings / Memory&lt;/strong&gt;清 prefs、tracker、Push generation、pending navigation 与本地通知。&lt;/div&gt;
          &lt;div class=&quot;flow-step control&quot;&gt;&lt;strong&gt;Complete&lt;/strong&gt;最后删除 journal；随后才生成新身份、seed、恢复正常 App。&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;audit-panel&quot; data-audit-panel=&quot;evidence&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;section-block&quot;&gt;
